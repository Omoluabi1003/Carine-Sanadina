<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1350" role="img" aria-labelledby="title desc">
  <title id="title">The Road to Sunshine book cover</title>
  <desc id="desc">A sunrise road cover for The Road to Sunshine by Carine Sanadina.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#662838"/><stop offset="0.45" stop-color="#c7834d"/><stop offset="0.72" stop-color="#f0c66a"/><stop offset="1" stop-color="#493023"/></linearGradient>
    <radialGradient id="sun" cx="50%" cy="47%" r="22%"><stop stop-color="#fff8d9"/><stop offset="0.45" stop-color="#ffd86f"/><stop offset="1" stop-color="#ffbb4d" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="900" height="1350" fill="url(#sky)"/>
  <circle cx="450" cy="620" r="260" fill="url(#sun)" opacity="0.95"/>
  <path d="M0 820 C220 720 688 730 900 820 L900 1350 L0 1350Z" fill="#2c291f" opacity="0.72"/>
  <path d="M360 1350 C390 1110 414 914 450 725 C487 914 514 1110 548 1350Z" fill="#191714"/>
  <path d="M448 800 C444 950 442 1120 438 1350" stroke="#f6d16f" stroke-width="10" stroke-dasharray="56 48"/>
  <text x="450" y="180" text-anchor="middle" fill="#fff8ee" font-family="Georgia, 'Times New Roman', serif" font-size="66" letter-spacing="2">THE</text>
  <text x="450" y="315" text-anchor="middle" fill="#fff8ee" font-family="Georgia, 'Times New Roman', serif" font-size="126" font-weight="700">Road to</text>
  <text x="450" y="455" text-anchor="middle" fill="#fff8ee" font-family="Georgia, 'Times New Roman', serif" font-size="132" font-weight="700">Sunshine</text>
  <text x="450" y="545" text-anchor="middle" fill="#4b2018" font-family="Georgia, 'Times New Roman', serif" font-size="38">A Journey of Struggles, Faith and Hope</text>
  <text x="450" y="1225" text-anchor="middle" fill="#fff8ee" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" letter-spacing="2">CARINE SANADINA</text>
</svg>
