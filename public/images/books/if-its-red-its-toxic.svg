<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1350" role="img" aria-labelledby="title desc">
  <title id="title">If It’s Red, It’s Toxic book cover</title>
  <desc id="desc">A red warning-sign inspired cover for If It’s Red, It’s Toxic by Carine Sanadina.</desc>
  <defs>
    <linearGradient id="red" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#5f0709"/><stop offset="0.5" stop-color="#bb1d21"/><stop offset="1" stop-color="#5b0809"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <rect width="900" height="1350" fill="#fff"/>
  <rect width="900" height="520" fill="url(#red)"/>
  <path d="M0 520 C150 470 220 560 355 505 C500 445 594 545 734 486 C810 454 858 438 900 430 L900 685 L0 685Z" fill="#fff"/>
  <path d="M0 500 C170 452 236 544 374 484 C520 420 604 526 746 468 C808 442 858 424 900 414" fill="none" stroke="#7d080c" stroke-width="54" opacity="0.75"/>
  <ellipse cx="450" cy="350" rx="320" ry="120" fill="#e22c32" opacity="0.28" filter="url(#soft)"/>
  <text x="450" y="220" text-anchor="middle" fill="#fff" font-family="Georgia, 'Times New Roman', serif" font-size="52" letter-spacing="3">IF IT’S</text>
  <text x="450" y="430" text-anchor="middle" fill="#fff" font-family="Arial Black, Impact, sans-serif" font-size="220" font-weight="900">RED,</text>
  <text x="450" y="615" text-anchor="middle" fill="#641214" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-style="italic">It’s</text>
  <text x="450" y="820" text-anchor="middle" fill="#7b0e12" font-family="Arial Black, Impact, sans-serif" font-size="196" font-weight="900">TOXIC</text>
  <text x="450" y="940" text-anchor="middle" fill="#1f1414" font-family="Georgia, 'Times New Roman', serif" font-size="30">Become Able To See The Warning Signs</text>
  <text x="450" y="978" text-anchor="middle" fill="#1f1414" font-family="Georgia, 'Times New Roman', serif" font-size="30">Of Abuse And Take Back Control Of Your</text>
  <text x="450" y="1016" text-anchor="middle" fill="#1f1414" font-family="Georgia, 'Times New Roman', serif" font-size="30">Life With Clarity And Strength.</text>
  <text x="450" y="1220" text-anchor="middle" fill="#111" font-family="Arial Black, Impact, sans-serif" font-size="54" font-weight="900">CARINE SANADINA</text>
</svg>
