<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1350" role="img" aria-labelledby="title desc">
  <title id="title">After The Storm book cover</title>
  <desc id="desc">A storm clearing into gold light cover for After The Storm by Carine Sanadina.</desc>
  <defs>
    <linearGradient id="storm" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#171b2b"/><stop offset="0.45" stop-color="#4c5363"/><stop offset="0.72" stop-color="#d5a34a"/><stop offset="1" stop-color="#fff1b7"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="900" height="1350" fill="url(#storm)"/>
  <g opacity="0.72" filter="url(#blur)">
    <ellipse cx="180" cy="245" rx="260" ry="110" fill="#0d1220"/>
    <ellipse cx="460" cy="220" rx="330" ry="125" fill="#222a3c"/>
    <ellipse cx="740" cy="275" rx="280" ry="110" fill="#4a5264"/>
  </g>
  <path d="M0 760 C190 820 360 700 540 760 C700 812 796 760 900 720 L900 1350 L0 1350Z" fill="#f8e3a2" opacity="0.22"/>
  <path d="M0 905 C210 850 358 885 520 840 C670 800 780 815 900 770 L900 1350 L0 1350Z" fill="#3d3025" opacity="0.64"/>
  <path d="M640 330 l-102 190 h94 l-82 220 l178 -300 h-104 z" fill="#ffed9b" opacity="0.88"/>
  <text x="450" y="220" text-anchor="middle" fill="#fff8ed" font-family="Georgia, 'Times New Roman', serif" font-size="62" letter-spacing="3">AFTER</text>
  <text x="450" y="390" text-anchor="middle" fill="#fff8ed" font-family="Georgia, 'Times New Roman', serif" font-size="148" font-weight="700">The</text>
  <text x="450" y="555" text-anchor="middle" fill="#fff8ed" font-family="Georgia, 'Times New Roman', serif" font-size="158" font-weight="700">Storm</text>
  <text x="450" y="658" text-anchor="middle" fill="#fff8ed" font-family="Georgia, 'Times New Roman', serif" font-size="34">Healing light beyond the hardest weather</text>
  <text x="450" y="1220" text-anchor="middle" fill="#fff8ee" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" letter-spacing="2">CARINE SANADINA</text>
</svg>
